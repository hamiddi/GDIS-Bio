name: Offline repository integrity
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax compilation
        run: python -m compileall -q scripts tools
      - name: Validate provided reviewer reference outputs
        run: python tools/verify_reference.py
      - name: Verify checksum manifest and scripts
        run: python tools/check_repository.py
      - name: Validate pipeline stage map
        run: python tools/pipeline.py --phase all --dry-run
